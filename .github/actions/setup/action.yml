name: Siapkan alat build
description: Node.js 22 dan Rust stable (keduanya dengan cache), lalu dependensi npm.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        cache: npm

    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        toolchain: stable

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: src-tauri

    - name: Pasang dependensi npm
      shell: pwsh
      run: npm ci
