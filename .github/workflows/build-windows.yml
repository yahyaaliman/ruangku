# Membuat installer Windows (.exe dan .msi) otomatis di GitHub.
# - Push ke main / jalankan manual: installer bisa diunduh di bagian "Artifacts" halaman run.
# - Push tag versi (mis. `git tag v0.3.0 && git push --tags`): installer juga diterbitkan
#   sebagai GitHub Release, sehingga fitur "Periksa pembaruan" di Ruangku bisa menemukannya.
# - Tanda tangan kode (opsional): isi secret WINDOWS_CERT_PFX (isi file .pfx dalam base64)
#   dan WINDOWS_CERT_PASSWORD di Settings > Secrets and variables > Actions. Tanpa secret,
#   installer tetap dibuat tetapi tidak bertanda tangan (Windows SmartScreen akan memperingatkan).
name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      RUANGKU_UPDATER_PUBLIC_KEY: ${{ vars.RUANGKU_UPDATER_PUBLIC_KEY }}
      HAS_CERT: ${{ secrets.WINDOWS_CERT_PFX != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Pasang dependensi
        run: npm ci

      - name: Uji frontend
        run: npm test

      - name: Uji backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Periksa kunci rilis
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: pwsh
        run: |
          if (-not $env:RUANGKU_UPDATER_PUBLIC_KEY -or -not $env:TAURI_SIGNING_PRIVATE_KEY) { throw "Kunci updater wajib untuk rilis tag." }

      - name: Build installer
        run: npx tauri build

      - name: Tanda tangani installer (bila sertifikat tersedia)
        if: env.HAS_CERT == 'true'
        env:
          CERT: ${{ secrets.WINDOWS_CERT_PFX }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "ruangku.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          $files = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe, src-tauri/target/release/bundle/msi/*.msi
          foreach ($f in $files) {
            & $signtool.FullName sign /f $pfx /p $env:CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 /d "Ruangku" $f.FullName
            if ($LASTEXITCODE -ne 0) { throw "Gagal menandatangani $($f.Name)" }
          }
          Remove-Item $pfx

      - name: Tanda tangan updater dan manifest
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/updater-manifest.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: Ruangku-Windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/latest.json

      - name: Terbitkan rilis (hanya untuk tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/latest.json
          generate_release_notes: true
