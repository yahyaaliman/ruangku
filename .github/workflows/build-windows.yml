# Installer Windows Ruangku (NSIS .exe untuk pengguna, .msi untuk penerapan IT).
#
# - Push ke main / jalankan manual: installer diunduh dari bagian "Artifacts" halaman run.
# - Push tag versi (`git tag v0.6.0 && git push --tags`): installer diterbitkan sebagai
#   GitHub Release beserta SHA256SUMS.txt dan bukti asal-usul build (attestation).
#
# Keamanan rantai build:
# - Semua action dikunci ke commit SHA (bukan tag yang bisa dipindah).
# - Hak token minimum; hanya job ini yang boleh menulis rilis & attestation.
# - Uji frontend & backend wajib lulus sebelum build.
# - Installer diberi checksum SHA-256 dan attestation build provenance (repo publik) yang bisa
#   dicek: `gh attestation verify <file> -R yahyaaliman/ruangku`. Dipindai Windows Defender bila
#   aktif di runner, dan VirusTotal bila secret VIRUSTOTAL_API_KEY (gratis) diatur.
#
# Tanda tangan kode Authenticode (opsional, menghilangkan peringatan "Unknown publisher"):
# - WINDOWS_SIGN_COMMAND (secret): perintah penanda tangan dengan %1 untuk path file, mis.
#   alat cloud HSM dari penerbit sertifikat atau `artifact-signing-cli ... %1`.
#   Kredensialnya bisa disimpan di secret SIGN_* / AZURE_* (diteruskan sebagai env).
# - atau WINDOWS_CERT_PFX (base64 .pfx) + WINDOWS_CERT_PASSWORD untuk sertifikat berbentuk file.
# Keduanya dipasang sebagai signCommand Tauri sehingga ruangku.exe, uninstaller, dan installer
# ikut ditandatangani, lalu diverifikasi dengan `signtool verify /pa`.
#
# Pembaruan di dalam aplikasi (opsional): variable RUANGKU_UPDATER_PUBLIC_KEY dan secret
# TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD). Tanpa kunci, rilis tetap terbit tanpa latest.json.
name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write # menerbitkan GitHub Release untuk tag
      id-token: write # attestation build provenance
      attestations: write
    env:
      RUANGKU_UPDATER_PUBLIC_KEY: ${{ vars.RUANGKU_UPDATER_PUBLIC_KEY }}
      BUNDLE: src-tauri/target/release/bundle
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Pasang dependensi
        run: npm ci

      - name: Uji frontend
        run: npm test

      - name: Uji backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Siapkan tanda tangan kode (bila dikonfigurasi)
        shell: pwsh
        env:
          SIGN_COMMAND: ${{ secrets.WINDOWS_SIGN_COMMAND }}
          CERT: ${{ secrets.WINDOWS_CERT_PFX }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $cfg = Join-Path $env:RUNNER_TEMP "ruangku-sign.json"
          if ($env:SIGN_COMMAND) {
            $sign = $env:SIGN_COMMAND
          } elseif ($env:CERT) {
            $pfx = Join-Path $env:RUNNER_TEMP "ruangku.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT))
            $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
            $sign = @{ cmd = $signtool; args = @("sign", "/f", $pfx, "/p", $env:CERT_PASSWORD, "/fd", "sha256", "/tr", "http://timestamp.digicert.com", "/td", "sha256", "/d", "Ruangku", "%1") }
          } else {
            Write-Host "::warning title=Installer belum bertanda tangan::Windows akan menampilkan peringatan SmartScreen (Unknown publisher). Lihat INSTALLER-WINDOWS.md untuk mengaktifkan tanda tangan kode."
            "TAURI_SIGN_ARGS=" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }
          @{ bundle = @{ windows = @{ signCommand = $sign } } } | ConvertTo-Json -Depth 6 | Set-Content -Path $cfg -Encoding utf8
          "TAURI_SIGN_ARGS=--config $cfg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SIGNED=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build installer
        shell: pwsh
        env:
          # Kredensial untuk alat penanda tangan pilihan (kosong bila tidak dipakai).
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SIGN_USERNAME: ${{ secrets.SIGN_USERNAME }}
          SIGN_PASSWORD: ${{ secrets.SIGN_PASSWORD }}
          SIGN_CREDENTIAL_ID: ${{ secrets.SIGN_CREDENTIAL_ID }}
          SIGN_TOTP_SECRET: ${{ secrets.SIGN_TOTP_SECRET }}
        run: |
          if ($env:TAURI_SIGN_ARGS) { npx tauri build $env:TAURI_SIGN_ARGS.Split(' ', 2) } else { npx tauri build }
          if ($LASTEXITCODE -ne 0) { throw "Build gagal" }
          $pfx = Join-Path $env:RUNNER_TEMP "ruangku.pfx"
          if (Test-Path $pfx) { Remove-Item $pfx -Force }

      - name: Periksa tanda tangan
        if: env.SIGNED == 'true'
        shell: pwsh
        run: |
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          $files = @(Get-Item src-tauri/target/release/ruangku.exe) + @(Get-ChildItem "$env:BUNDLE/nsis/*.exe", "$env:BUNDLE/msi/*.msi")
          foreach ($f in $files) {
            & $signtool verify /pa /q $f.FullName
            if ($LASTEXITCODE -ne 0) { throw "Tanda tangan tidak valid: $($f.Name)" }
            Write-Host "Tanda tangan valid: $($f.Name)"
          }

      - name: Pindai dengan Windows Defender (bila aktif di runner)
        shell: pwsh
        run: |
          # Di runner GitHub layanan Defender biasanya dimatikan (hr 0x800106ba). MpCmdRun memakai
          # kode keluar 2 untuk ancaman MAUPUN galat, jadi hasil dibaca dari teks keluarannya.
          $mp = Join-Path $env:ProgramFiles "Windows Defender\MpCmdRun.exe"
          $status = $null
          try { $status = Get-MpComputerStatus -ErrorAction Stop } catch { }
          if (-not (Test-Path $mp) -or -not $status -or -not $status.AntivirusEnabled) {
            Write-Host "::notice::Windows Defender tidak aktif di runner; pemindaian Defender dilewati."
            "DEFENDER=skipped" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }
          $clean = $true
          foreach ($f in Get-ChildItem "$env:BUNDLE/nsis/*.exe", "$env:BUNDLE/msi/*.msi") {
            $out = (& $mp -Scan -ScanType 3 -File $f.FullName -DisableRemediation 2>&1 | Out-String)
            Write-Host $out
            if ($out -match "found no threats") { Write-Host "Bersih: $($f.Name)" }
            elseif ($out -match "found \d+ threats") { throw "Windows Defender menemukan ancaman di $($f.Name)" }
            else { $clean = $false; Write-Host "::warning::Pemindaian Defender $($f.Name) tidak selesai." }
          }
          "DEFENDER=$(if ($clean) { 'clean' } else { 'skipped' })" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          exit 0

      - name: Pindai dengan VirusTotal (bila VIRUSTOTAL_API_KEY diatur)
        continue-on-error: true
        shell: pwsh
        env:
          VT_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          if (-not $env:VT_KEY) { Write-Host "VIRUSTOTAL_API_KEY tidak diatur; dilewati."; exit 0 }
          $h = @{ "x-apikey" = $env:VT_KEY }
          $lines = @()
          foreach ($f in Get-ChildItem "$env:BUNDLE/nsis/*.exe", "$env:BUNDLE/msi/*.msi") {
            $sha = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            $up = Invoke-RestMethod -Method Post -Uri "https://www.virustotal.com/api/v3/files" -Headers $h -Form @{ file = Get-Item $f.FullName }
            $stats = $null
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Seconds 20 # batas API gratis: 4 permintaan/menit
              $an = Invoke-RestMethod -Uri "https://www.virustotal.com/api/v3/analyses/$($up.data.id)" -Headers $h
              if ($an.data.attributes.status -eq "completed") { $stats = $an.data.attributes.stats; break }
            }
            if (-not $stats) { Write-Host "::warning::Analisis VirusTotal $($f.Name) belum selesai."; continue }
            $bad = [int]$stats.malicious + [int]$stats.suspicious
            $total = [int]$stats.malicious + [int]$stats.suspicious + [int]$stats.undetected + [int]$stats.harmless
            if ($bad -gt 0) { Write-Host "::warning title=VirusTotal::$($f.Name): $bad dari $total mesin menandai file (periksa apakah positif palsu)." }
            $lines += "- VirusTotal $($f.Name): $bad dari $total mesin antivirus menandai file. [Lihat laporan](https://www.virustotal.com/gui/file/$sha)"
          }
          if ($lines) { $lines | Set-Content -Path "$env:RUNNER_TEMP/virustotal.md" -Encoding utf8 }

      - name: Tanda tangan updater dan manifest (rilis tag)
        if: env.IS_TAG == 'true'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:RUANGKU_UPDATER_PUBLIC_KEY -or -not $env:TAURI_SIGNING_PRIVATE_KEY) {
            Write-Host "::warning title=Pembaruan otomatis belum aktif::Kunci updater belum diatur; rilis terbit tanpa latest.json. Pengguna memperbarui dengan mengunduh installer baru."
            exit 0
          }
          node scripts/updater-manifest.mjs
          if ($LASTEXITCODE -ne 0) { throw "Gagal membuat manifest updater" }

      - name: Checksum SHA-256 dan catatan rilis
        shell: pwsh
        run: |
          $files = Get-ChildItem "$env:BUNDLE/nsis/*.exe", "$env:BUNDLE/msi/*.msi"
          $lines = foreach ($f in $files) { "{0}  {1}" -f (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower(), $f.Name }
          $lines | Set-Content -Path "$env:BUNDLE/SHA256SUMS.txt" -Encoding ascii
          $setup = ($files | Where-Object Extension -eq ".exe" | Select-Object -First 1).Name
          $signed = if ($env:SIGNED -eq "true") { "Installer ditandatangani (Authenticode) dan tanda tangannya diverifikasi saat build." } else { "Installer belum bertanda tangan kode, sehingga Windows SmartScreen menampilkan peringatan. Pastikan file berasal dari halaman rilis ini dan checksum-nya cocok, lalu pilih **More info → Run anyway**." }
          $scan = @()
          if ($env:DEFENDER -eq "clean") { $scan += "- Dipindai Windows Defender saat build: tidak ada ancaman." }
          $vt = Join-Path $env:RUNNER_TEMP "virustotal.md"
          if (Test-Path $vt) { $scan += Get-Content $vt }
          @(
            "## Cara memasang",
            "",
            "1. Unduh **$setup** (installer standar, tanpa hak admin, terpasang untuk pengguna ini).",
            "2. Jalankan, ikuti wizard, lalu buka Ruangku dari Start Menu atau desktop. Versi lama diperbarui otomatis; data tetap aman.",
            "3. File **.msi** ditujukan untuk penerapan oleh admin IT (dipasang untuk semua pengguna).",
            "",
            "## Keamanan",
            "",
            "- $signed",
            "- Dibuat otomatis oleh GitHub Actions dari kode di repo ini setelah seluruh uji frontend dan backend lulus.",
            "- Cocokkan checksum di PowerShell: ``Get-FileHash .\$setup -Algorithm SHA256`` dengan isi **SHA256SUMS.txt**:",
            "",
            '```',
            ($lines -join "`n"),
            '```',
            "",
            "- Bukti asal-usul build: ``gh attestation verify .\$setup -R $env:GITHUB_REPOSITORY``."
          ) + $scan | Set-Content -Path "$env:RUNNER_TEMP/release-notes.md" -Encoding utf8
          Get-Content "$env:BUNDLE/SHA256SUMS.txt"

      - name: Attestation asal-usul build
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Ruangku-Windows-installer
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/latest.json
            src-tauri/target/release/bundle/SHA256SUMS.txt

      - name: Terbitkan rilis (hanya untuk tag v*)
        if: env.IS_TAG == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/latest.json
            src-tauri/target/release/bundle/SHA256SUMS.txt
