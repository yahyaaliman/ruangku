name: Validate changes

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - name: Install dependencies
        run: npm ci
      - name: Test frontend
        run: npm test -- --maxWorkers=4
      - name: Test project permissions against PocketBase
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'pocketbase.zip'
          $binaryDir = Join-Path $env:RUNNER_TEMP 'pocketbase-test'
          Invoke-WebRequest 'https://github.com/pocketbase/pocketbase/releases/download/v0.40.6/pocketbase_0.40.6_windows_amd64.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '33A2A1D255CADDED77346FC7F5DE37DCA21BA4BAD0D9CAE0235A50B3B703D6D9') { throw 'PocketBase checksum mismatch' }
          Expand-Archive $archive -DestinationPath $binaryDir
          $env:PB_TEST_BIN = Join-Path $binaryDir 'pocketbase.exe'
          node server/run-access-test.mjs
      - name: Build frontend
        run: npm run build
      - name: Test Windows backend
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
