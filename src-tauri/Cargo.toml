[package]
name = "ruangku"
version = "0.5.0"
description = "Ruangku - jadwal, reminder, OKR, KPI harian, catatan, dan manajemen file"
authors = ["Ruangku"]
edition = "2021"

[lib]
name = "ruangku_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-updater = "2.14.1"
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
trash = "5"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "native-tls"] }
imap = "2.4"
native-tls = "0.2"
mailparse = "0.15"
tokio = { version = "1", features = ["time"] }

[target.'cfg(windows)'.dependencies]
winrt-toast-reborn = "0.3.8"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_Security_Credentials"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["time", "macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
